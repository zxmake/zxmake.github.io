site_name: xmake-docs
site_url: https://zxmake.github.io/
repo_url: https://github.com/TOMO-CAT/xmake
repo_name: TOMO-CAT/xmake

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/logo-64.png
  favicon: assets/favicon.ico
  font:
    text: "Plus Jakarta Sans"
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      separator: '[\s\-\.]+'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/header.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zxmake

nav:
  - 最佳实践: practices/best-practices.md
  - 特性:
    - 远程 Toolchain、Rule 和 Option: features/remote-toolchain-rules-options.md
    - 远程编译: features/remote-build.md
    - 分布式编译: features/distcc-build.md
    - 编译缓存: features/build-cache.md
    - Package 和 Cache 轮转清理: features/hourly-cleaner.md
    - Unity 编译加速: features/unity-build.md
    - 自动扫描源码生成工程: features/autogen.md
    - 尝试使用其他构建系统: features/try-build.md
  - tutorial:
    - 安装: tutorial/install.md
    - 快速入门: tutorial/quick-start.md
    - 语法描述: tutorial/syntax-description.md
    - 描述域: tutorial/description-scope.md
    - 工程例子: tutorial/project-examples.md
    - 配置说明: tutorial/configuration.md
    - 环境变量: tutorial/environment-variables.md
    - 构建策略: tutorial/build-policies.md
